name: Build Geocoder Index

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      pbf_url:
        description: 'Override PBF URL (leave empty to use replication diffs)'
        required: false
        type: string
      force_fresh_download:
        description: 'Force fresh planet PBF download (skip replication diffs)'
        required: false
        type: boolean
        default: false
      skip_patch:
        description: 'Skip patch generation'
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner label'
        required: false
        type: string
        default: 'self-hosted'

env:
  S3_BUCKET: ${{ secrets.GEOCODER_S3_BUCKET }}
  S3_REGION: ${{ secrets.GEOCODER_S3_REGION }}
  S3_PREFIX: geocoder
  # All regions produced by --continents (must match build output)
  REGIONS: "planet africa asia europe north-america south-america oceania central-america antarctica"

jobs:
  build:
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libz-dev libzstd-dev aria2 jq
          pip install --break-system-packages osmium 2>/dev/null \
            || pip install --user osmium 2>/dev/null \
            || python3 -m pip install --user --break-system-packages osmium
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.GEOCODER_S3_REGION }}

      - name: Build tools
        run: |
          cd builder && mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc) build-index geocoder-diff geocoder-patch
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Determine build date
        id: meta
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

          EXISTS=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/$BUILD_DATE/planet/" 2>/dev/null | wc -l)
          if [ "$EXISTS" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Build for $BUILD_DATE already exists"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Obtain PBF
        if: steps.meta.outputs.skip != 'true'
        id: pbf
        run: |
          WORKDIR="${{ runner.temp }}/geocoder-build"
          mkdir -p "$WORKDIR"
          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.pbf_url }}" ]; then
            echo "Downloading from override URL..."
            aria2c -x 8 -s 8 --max-tries=3 -d "$WORKDIR" -o planet.osm.pbf "${{ inputs.pbf_url }}"
            echo "method=download" >> "$GITHUB_OUTPUT"

          elif [ "${{ inputs.force_fresh_download }}" = "true" ]; then
            echo "Downloading fresh planet PBF..."
            PBF_URL=$(curl -sI "https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf" \
              | grep -i '^location:' | awk '{print $2}' | tr -d '\r')
            aria2c -x 8 -s 8 --max-tries=3 -d "$WORKDIR" -o planet.osm.pbf "$PBF_URL"
            echo "method=download" >> "$GITHUB_OUTPUT"

          else
            STORED_PBF="s3://$S3_BUCKET/$S3_PREFIX/pbf/planet-current.osm.pbf"
            if aws s3 ls "$STORED_PBF" 2>/dev/null | grep -q 'planet-current'; then
              echo "Downloading stored PBF and applying replication diffs..."
              aws s3 cp "$STORED_PBF" "$WORKDIR/planet.osm.pbf" --no-progress --only-show-errors
              pyosmium-up-to-date -v \
                --server https://planet.openstreetmap.org/replication/day \
                -s 2000 "$WORKDIR/planet.osm.pbf" 2>&1
              echo "method=diff" >> "$GITHUB_OUTPUT"
            else
              echo "No stored PBF — downloading fresh planet..."
              PBF_URL=$(curl -sI "https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf" \
                | grep -i '^location:' | awk '{print $2}' | tr -d '\r')
              aria2c -x 8 -s 8 --max-tries=3 -d "$WORKDIR" -o planet.osm.pbf "$PBF_URL"
              echo "method=download" >> "$GITHUB_OUTPUT"
            fi
          fi

          ls -lh "$WORKDIR/planet.osm.pbf"

      - name: Build index with continents
        if: steps.meta.outputs.skip != 'true'
        run: |
          WORKDIR="${{ steps.pbf.outputs.workdir }}"
          echo "Building geocoder index with continent extracts..."
          time build-index "$WORKDIR/output/" "$WORKDIR/planet.osm.pbf" \
            --simplify-epsilon --epsilon-scale 1 --continents 2>&1 | tail -10
          echo ""
          echo "Build output:"
          ls -d "$WORKDIR/output"/*/ 2>/dev/null || true
          ls "$WORKDIR/output/"*.bin 2>/dev/null | wc -l
          echo "planet + $(ls -d "$WORKDIR/output"/*/ 2>/dev/null | wc -l) continent extracts"

      - name: Upload PBF to S3
        if: steps.meta.outputs.skip != 'true'
        run: |
          WORKDIR="${{ steps.pbf.outputs.workdir }}"
          aws s3 cp "$WORKDIR/planet.osm.pbf" \
            "s3://$S3_BUCKET/$S3_PREFIX/pbf/planet-current.osm.pbf" \
            --no-progress --only-show-errors
          rm -f "$WORKDIR/planet.osm.pbf"

      - name: Upload builds to S3
        if: steps.meta.outputs.skip != 'true'
        run: |
          WORKDIR="${{ steps.pbf.outputs.workdir }}"
          BUILD_DATE="${{ steps.meta.outputs.date }}"
          S3_BUILDS="s3://$S3_BUCKET/$S3_PREFIX/builds/$BUILD_DATE"

          # Upload planet (root .bin files)
          echo "Uploading planet..."
          aws s3 sync "$WORKDIR/output/" "$S3_BUILDS/planet/" \
            --exclude "*/*" --no-progress --only-show-errors

          # Upload each continent
          for region in $REGIONS; do
            [ "$region" = "planet" ] && continue
            if [ -d "$WORKDIR/output/$region" ]; then
              echo "Uploading $region..."
              aws s3 sync "$WORKDIR/output/$region/" "$S3_BUILDS/$region/" \
                --no-progress --only-show-errors
            fi
          done

          # Upload manifest
          aws s3 cp "$WORKDIR/output/manifest.json" "$S3_BUILDS/manifest.json" \
            --no-progress --only-show-errors

          echo "$BUILD_DATE" | aws s3 cp - \
            "s3://$S3_BUCKET/$S3_PREFIX/builds/latest.txt" \
            --content-type text/plain

      - name: Find previous build
        if: steps.meta.outputs.skip != 'true' && inputs.skip_patch != true
        id: prev
        run: |
          CURRENT="${{ steps.meta.outputs.date }}"
          PREV=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/" \
            | grep 'PRE' | awk '{print $2}' | tr -d '/' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort | grep -B1 "^$CURRENT$" | head -1)

          if [ -n "$PREV" ] && [ "$PREV" != "$CURRENT" ]; then
            echo "date=$PREV" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Previous build: $PREV"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No previous build found"
          fi

      - name: Generate and verify patches for all regions
        if: steps.prev.outputs.found == 'true'
        run: |
          WORKDIR="${{ steps.pbf.outputs.workdir }}"
          PREV="${{ steps.prev.outputs.date }}"
          CURRENT="${{ steps.meta.outputs.date }}"
          PATCH_DIR="$WORKDIR/patches"
          mkdir -p "$PATCH_DIR"

          echo "## Patch Generation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Region | Patch Size | Verified |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-----------|----------|" >> "$GITHUB_STEP_SUMMARY"

          for region in $REGIONS; do
            if [ "$region" = "planet" ]; then
              NEW_DIR="$WORKDIR/output"
              S3_PREV="s3://$S3_BUCKET/$S3_PREFIX/builds/$PREV/planet"
            else
              NEW_DIR="$WORKDIR/output/$region"
              S3_PREV="s3://$S3_BUCKET/$S3_PREFIX/builds/$PREV/$region"
            fi

            # Check new build exists
            if [ ! -d "$NEW_DIR" ] || [ $(ls "$NEW_DIR"/*.bin 2>/dev/null | wc -l) -lt 14 ]; then
              echo "  $region: skipped (no new build)"
              continue
            fi

            # Check previous build exists in S3
            PREV_COUNT=$(aws s3 ls "$S3_PREV/" 2>/dev/null | grep '\.bin$' | wc -l)
            if [ "$PREV_COUNT" -lt 14 ]; then
              echo "  $region: skipped (no previous build in S3)"
              continue
            fi

            # Download previous build
            PREV_DIR="$WORKDIR/prev-$region"
            mkdir -p "$PREV_DIR"
            aws s3 sync "$S3_PREV/" "$PREV_DIR/" --no-progress --only-show-errors

            # Generate patch
            PATCH_FILE="$PATCH_DIR/$region/${PREV}-to-${CURRENT}.gcpatch"
            mkdir -p "$PATCH_DIR/$region"
            geocoder-diff "$PREV_DIR" "$NEW_DIR" -o "$PATCH_FILE" 2>/dev/null
            PATCH_SIZE=$(stat -c%s "$PATCH_FILE" 2>/dev/null || echo 0)
            PATCH_KB=$((PATCH_SIZE / 1024))

            # Verify patch
            VERIFY_DIR="$WORKDIR/verify-$region"
            mkdir -p "$VERIFY_DIR"
            geocoder-patch "$PREV_DIR" "$PATCH_FILE" -o "$VERIFY_DIR" 2>/dev/null

            FAIL=0
            for f in "$NEW_DIR"/*.bin; do
              b=$(basename "$f")
              if ! cmp -s "$VERIFY_DIR/$b" "$NEW_DIR/$b"; then
                echo "::error::$region: $b MISMATCH after patching"
                FAIL=1
              fi
            done

            if [ $FAIL -eq 0 ]; then
              echo "  $region: PASS (${PATCH_KB} KiB)"
              echo "| $region | ${PATCH_KB} KiB | PASS |" >> "$GITHUB_STEP_SUMMARY"

              # Upload verified patch
              aws s3 cp "$PATCH_FILE" \
                "s3://$S3_BUCKET/$S3_PREFIX/patches/$region/${PREV}-to-${CURRENT}.gcpatch" \
                --no-progress --only-show-errors
            else
              echo "::error::$region: patch verification FAILED"
              echo "| $region | ${PATCH_KB} KiB | **FAIL** |" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            # Clean up this region's temp data
            rm -rf "$PREV_DIR" "$VERIFY_DIR"
          done

      - name: Clean up old builds (keep last 2)
        if: steps.meta.outputs.skip != 'true'
        run: |
          BUILDS=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/" \
            | grep 'PRE' | awk '{print $2}' | tr -d '/' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort -r)

          COUNT=0
          while IFS= read -r build; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 2 ]; then
              echo "Deleting old build: $build"
              aws s3 rm "s3://$S3_BUCKET/$S3_PREFIX/builds/$build/" --recursive \
                --no-progress --only-show-errors
            fi
          done <<< "$BUILDS"

      - name: Update index.json
        if: steps.meta.outputs.skip != 'true'
        run: |
          BUILD_DATE="${{ steps.meta.outputs.date }}"

          # Collect builds
          BUILDS_JSON=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/" \
            | grep 'PRE' | awk '{print $2}' | tr -d '/' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort -r \
            | while read -r b; do
                # List regions in this build
                REGIONS_LIST=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/$b/" \
                  | grep 'PRE' | awk '{print $2}' | tr -d '/' \
                  | jq -R . | jq -s .)
                echo "{\"date\":\"$b\",\"regions\":$REGIONS_LIST}"
              done | jq -s .)

          # Collect patches grouped by region
          PATCHES_JSON=$(for region in $REGIONS; do
            REGION_PATCHES=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/patches/$region/" 2>/dev/null \
              | awk '{print $4}' | grep '\.gcpatch$' | sort -r \
              | while read -r p; do
                  SIZE=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/patches/$region/$p" | awk '{print $3}')
                  FROM=$(echo "$p" | sed 's/\(.*\)-to-.*/\1/')
                  TO=$(echo "$p" | sed 's/.*-to-\(.*\)\.gcpatch/\1/')
                  echo "{\"from\":\"$FROM\",\"to\":\"$TO\",\"file\":\"patches/$region/$p\",\"bytes\":${SIZE:-0}}"
                done | jq -s .)
            [ "$REGION_PATCHES" = "null" ] && REGION_PATCHES="[]"
            echo "{\"region\":\"$region\",\"patches\":$REGION_PATCHES}"
          done | jq -s .)

          # Build index.json
          jq -n \
            --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg latest "$BUILD_DATE" \
            --argjson builds "$BUILDS_JSON" \
            --argjson patches "$PATCHES_JSON" \
            '{
              updated: $updated,
              latest_build: $latest,
              builds: $builds,
              patches: $patches
            }' > /tmp/index.json

          cat /tmp/index.json

          aws s3 cp /tmp/index.json \
            "s3://$S3_BUCKET/$S3_PREFIX/index.json" \
            --content-type application/json \
            --no-progress --only-show-errors

      - name: Summary
        if: always()
        run: |
          BUILD_DATE="${{ steps.meta.outputs.date }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Build Info" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Date** | $BUILD_DATE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **PBF method** | ${{ steps.pbf.outputs.method || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.meta.outputs.skip }}" = "true" ]; then
            echo "| **Status** | Skipped (already exists) |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| **Status** | Built and uploaded |" >> "$GITHUB_STEP_SUMMARY"
          fi
