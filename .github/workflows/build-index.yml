name: Build Geocoder Index

on:
  schedule:
    # Weekly on Monday at 06:00 UTC (after OSM planet dump is ready on Friday)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      pbf_url:
        description: 'Override PBF URL (leave empty for latest planet)'
        required: false
        type: string
      skip_patch:
        description: 'Skip patch generation'
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner label (default: self-hosted)'
        required: false
        type: string
        default: 'self-hosted'

env:
  S3_BUCKET: ${{ secrets.GEOCODER_S3_BUCKET }}
  S3_REGION: ${{ secrets.GEOCODER_S3_REGION }}
  S3_PREFIX: geocoder  # s3://bucket/geocoder/builds/..., s3://bucket/geocoder/patches/...

jobs:
  build:
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ libz-dev libzstd-dev aria2 awscli jq

      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region "${{ secrets.GEOCODER_S3_REGION }}"

      - name: Determine PBF URL and date
        id: pbf
        run: |
          if [ -n "${{ inputs.pbf_url }}" ]; then
            PBF_URL="${{ inputs.pbf_url }}"
          else
            # Follow the redirect from planet-latest to get the actual dated URL
            PBF_URL=$(curl -sI "https://planet.openstreetmap.org/pbf/planet-latest.osm.pbf" \
              | grep -i '^location:' | awk '{print $2}' | tr -d '\r')
          fi
          echo "url=$PBF_URL" >> "$GITHUB_OUTPUT"

          # Extract date from URL (e.g., planet-260323.osm.pbf → 2026-03-23)
          FILENAME=$(basename "$PBF_URL")
          DATE_RAW=$(echo "$FILENAME" | sed -n 's/planet-\([0-9]*\)\.osm\.pbf/\1/p')
          if [ -n "$DATE_RAW" ]; then
            BUILD_DATE="20${DATE_RAW:0:2}-${DATE_RAW:2:2}-${DATE_RAW:4:2}"
          else
            BUILD_DATE=$(date -u +%Y-%m-%d)
          fi
          echo "date=$BUILD_DATE" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "PBF: $PBF_URL"
          echo "Date: $BUILD_DATE"

      - name: Check if build already exists
        id: check
        run: |
          EXISTS=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/${{ steps.pbf.outputs.date }}/" 2>/dev/null | wc -l)
          if [ "$EXISTS" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Build for ${{ steps.pbf.outputs.date }} already exists in S3, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download PBF
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "Downloading ${{ steps.pbf.outputs.url }}..."
          aria2c -x 8 -s 8 --max-tries=3 --retry-wait=30 \
            -d /tmp -o planet.osm.pbf \
            "${{ steps.pbf.outputs.url }}"
          ls -lh /tmp/planet.osm.pbf

      - name: Build index
        if: steps.check.outputs.skip != 'true'
        run: |
          cd builder
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc) build-index geocoder-diff geocoder-patch

          echo "Building index..."
          mkdir -p /tmp/index-output
          time ./build-index /tmp/index-output/ /tmp/planet.osm.pbf \
            --simplify-epsilon --epsilon-scale 1 2>&1 | tail -10

          echo "Build complete:"
          ls -lh /tmp/index-output/

          # Free disk space — PBF no longer needed
          rm -f /tmp/planet.osm.pbf

      - name: Upload build to S3
        if: steps.check.outputs.skip != 'true'
        run: |
          BUILD_DATE="${{ steps.pbf.outputs.date }}"
          S3_PATH="s3://$S3_BUCKET/$S3_PREFIX/builds/$BUILD_DATE"

          echo "Uploading build to $S3_PATH..."
          aws s3 sync /tmp/index-output/ "$S3_PATH/" \
            --no-progress --only-show-errors

          # Also update the "latest" pointer
          echo "$BUILD_DATE" | aws s3 cp - "s3://$S3_BUCKET/$S3_PREFIX/builds/latest.txt" \
            --content-type text/plain

          echo "Upload complete"

      - name: Find previous build for patching
        if: steps.check.outputs.skip != 'true' && inputs.skip_patch != true
        id: prev
        run: |
          # List all builds, find the most recent one before the current date
          CURRENT="${{ steps.pbf.outputs.date }}"
          PREV=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/" \
            | grep 'PRE' | awk '{print $2}' | tr -d '/' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort | grep -B1 "^$CURRENT$" | head -1)

          if [ -n "$PREV" ] && [ "$PREV" != "$CURRENT" ]; then
            echo "date=$PREV" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Previous build: $PREV"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No previous build found for patching"
          fi

      - name: Download previous build for patching
        if: steps.prev.outputs.found == 'true'
        run: |
          PREV="${{ steps.prev.outputs.date }}"
          mkdir -p /tmp/prev-build
          echo "Downloading previous build ($PREV)..."
          aws s3 sync "s3://$S3_BUCKET/$S3_PREFIX/builds/$PREV/" /tmp/prev-build/ \
            --no-progress --only-show-errors
          ls -lh /tmp/prev-build/

      - name: Generate patch
        if: steps.prev.outputs.found == 'true'
        run: |
          PREV="${{ steps.prev.outputs.date }}"
          CURRENT="${{ steps.pbf.outputs.date }}"
          PATCH_NAME="${PREV}-to-${CURRENT}.gcpatch"

          echo "Generating patch: $PATCH_NAME"
          cd builder/build
          time ./geocoder-diff /tmp/prev-build/ /tmp/index-output/ \
            -o "/tmp/$PATCH_NAME" 2>&1 | tail -10

          ls -lh "/tmp/$PATCH_NAME"

          # Verify patch produces correct output
          echo "Verifying patch..."
          mkdir -p /tmp/patch-verify
          time ./geocoder-patch /tmp/prev-build/ "/tmp/$PATCH_NAME" \
            -o /tmp/patch-verify/ 2>&1 | tail -5

          echo "Comparing patched output with fresh build..."
          FAIL=0
          for f in /tmp/index-output/*.bin; do
            b=$(basename "$f")
            if ! cmp -s "/tmp/patch-verify/$b" "/tmp/index-output/$b"; then
              echo "MISMATCH: $b"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 0 ]; then
            echo "Patch verification: ALL FILES MATCH"
          else
            echo "::error::Patch verification FAILED — some files don't match"
            exit 1
          fi

          rm -rf /tmp/patch-verify /tmp/prev-build

      - name: Upload patch to S3
        if: steps.prev.outputs.found == 'true'
        run: |
          PREV="${{ steps.prev.outputs.date }}"
          CURRENT="${{ steps.pbf.outputs.date }}"
          PATCH_NAME="${PREV}-to-${CURRENT}.gcpatch"

          echo "Uploading patch..."
          aws s3 cp "/tmp/$PATCH_NAME" \
            "s3://$S3_BUCKET/$S3_PREFIX/patches/$PATCH_NAME" \
            --no-progress --only-show-errors

      - name: Clean up old builds (keep last 2)
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "Checking for old builds to clean up..."
          BUILDS=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/" \
            | grep 'PRE' | awk '{print $2}' | tr -d '/' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort -r)

          COUNT=0
          while IFS= read -r build; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 2 ]; then
              echo "Deleting old build: $build"
              aws s3 rm "s3://$S3_BUCKET/$S3_PREFIX/builds/$build/" --recursive \
                --no-progress --only-show-errors
            else
              echo "Keeping build: $build"
            fi
          done <<< "$BUILDS"

      - name: Update index.json
        if: steps.check.outputs.skip != 'true'
        run: |
          CURRENT="${{ steps.pbf.outputs.date }}"

          # List all builds
          BUILDS=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/" \
            | grep 'PRE' | awk '{print $2}' | tr -d '/' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' \
            | sort -r)

          # List all patches
          PATCHES=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/patches/" \
            | awk '{print $4}' | grep '\.gcpatch$' | sort -r)

          # Get file sizes for current build
          BUILD_FILES=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/$CURRENT/" \
            | awk '{printf "{\"name\":\"%s\",\"size\":%d},", $4, $3}' | sed 's/,$//')

          # Build JSON
          cat > /tmp/index.json << INDEXEOF
          {
            "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "latest_build": "$CURRENT",
            "builds": [
          $(echo "$BUILDS" | while read -r b; do
            SIZE=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/builds/$b/" --summarize --recursive \
              | grep 'Total Size' | awk '{print $3}')
            echo "    {\"date\": \"$b\", \"path\": \"builds/$b/\", \"total_bytes\": $SIZE},"
          done | sed '$ s/,$//')
            ],
            "patches": [
          $(echo "$PATCHES" | while read -r p; do
            SIZE=$(aws s3 ls "s3://$S3_BUCKET/$S3_PREFIX/patches/$p" | awk '{print $3}')
            FROM=$(echo "$p" | sed 's/\(.*\)-to-.*/\1/')
            TO=$(echo "$p" | sed 's/.*-to-\(.*\)\.gcpatch/\1/')
            echo "    {\"from\": \"$FROM\", \"to\": \"$TO\", \"file\": \"patches/$p\", \"bytes\": $SIZE},"
          done | sed '$ s/,$//')
            ],
            "files": [$BUILD_FILES]
          }
          INDEXEOF

          # Pretty-print and upload
          python3 -m json.tool /tmp/index.json > /tmp/index-pretty.json 2>/dev/null \
            || cp /tmp/index.json /tmp/index-pretty.json
          cat /tmp/index-pretty.json

          aws s3 cp /tmp/index-pretty.json \
            "s3://$S3_BUCKET/$S3_PREFIX/index.json" \
            --content-type application/json \
            --no-progress --only-show-errors

          echo "Index updated"

      - name: Summary
        if: always()
        run: |
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date**: ${{ steps.pbf.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PBF**: ${{ steps.pbf.outputs.filename }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            echo "- **Status**: Skipped (already exists)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Status**: Built and uploaded" >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ steps.prev.outputs.found }}" = "true" ]; then
              echo "- **Patch**: ${{ steps.prev.outputs.date }} → ${{ steps.pbf.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
